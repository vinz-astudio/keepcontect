name: Database tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/local-supabase-replay*.mjs"
      - "package.json"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pgtap:
    name: pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start isolated Postgres
        run: supabase db start
      - name: Replay migrations and run pgTAP
        run: npm run db:replay:compat
