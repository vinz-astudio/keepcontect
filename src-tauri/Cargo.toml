[package]
name = "app"
version = "0.7.10"

description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# DESK-01 (2026-11-02): OS notifications for safety notices. ~2.4 keeps Tauri core on 2.11 (2.5+ requires tauri ^2.12); matches @tauri-apps/plugin-notification 2.4.0.
tauri-plugin-notification = "~2.4"
ureq = { version = "2.10", features = ["tls"] }
